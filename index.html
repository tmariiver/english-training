<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Career English トレーニング</title>
<style>
  :root{
    --bg:#f6f5f1; --panel:#ffffff; --ink:#26241f; --ink-soft:#6b6659;
    --accent:#a8763e; --accent-dark:#7c5527; --accent-soft:#f0e4d3; --line:#e6e1d6;
    --shadow:0 1px 2px rgba(30,25,15,0.06),0 6px 20px rgba(30,25,15,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a17; --panel:#242220; --ink:#ece7dc; --ink-soft:#a49d8c;
      --accent:#d3a66b; --accent-dark:#e6c08a; --accent-soft:#3a3226; --line:#37342c;
      --shadow:0 1px 2px rgba(0,0,0,0.3),0 6px 24px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{max-width:480px;width:100%;}
  h1{font-size:1.3rem;margin:0 0 6px;}
  p.lead{color:var(--ink-soft);font-size:.88rem;margin:0 0 20px;}
  .card{
    display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:18px; margin-bottom:14px; text-decoration:none; color:var(--ink);
  }
  .card h2{margin:0 0 6px;font-size:1.05rem;color:var(--accent-dark);}
  .card p{margin:0;font-size:.85rem;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Career English トレーニング</h1>
  <p class="lead">同じキャリア英文素材を使った2つの練習アプリです。</p>
  <a class="card" href="career-reading-app/">
    <h2>音読トレーナー</h2>
    <p>全文・各セクションを繰り返し音読して身体に染み込ませる。シャドーイングや暗唱テストも。</p>
  </a>
  <a class="card" href="career-eiyaku-app/">
    <h2>瞬間英作文トレーナー</h2>
    <p>日本語を見て瞬時に英語を組み立てる練習。フレーズ・文をランダム出題して自己採点。</p>
  </a>
</div>
</body>
</html>
